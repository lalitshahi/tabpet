<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Belly · Tab Pet</title>
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="belly.css">
</head>
<body>
  <main class="belly">
    <header class="top">
      <div class="pet-frame world" data-world><span class="stars"></span><canvas id="pet" width="64" height="48" role="img" aria-label="Your pet"></canvas></div>
      <div class="intro">
        <h1 id="title">The belly</h1>
        <p id="sub" class="muted">Every tab your pet ate, kept safe.</p>
      </div>
    </header>

    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M16.5 16.5 21 21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      <input type="search" id="q" placeholder="What were you looking for?" aria-label="Search eaten tabs" autocomplete="off" spellcheck="false">
      <kbd id="slash" aria-hidden="true">/</kbd>
    </div>
    <p class="keys muted" id="keys">Type to search · <kbd>↑</kbd> <kbd>↓</kbd> to move · <kbd>Enter</kbd> brings it back · <kbd>Esc</kbd> clears</p>

    <nav class="shelves" id="shelves" aria-label="Filter by site"></nav>

    <section id="results" aria-live="polite"></section>
  </main>

  <div class="toast" id="toast" role="status" hidden></div>
  <script type="module" src="belly.js"></script>
</body>
</html>
